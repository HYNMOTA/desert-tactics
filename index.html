<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Grimdark Desert Tactics 3D</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0d0a07;
            font-family: 'Courier New', monospace;
            color: #d4a359;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* Игровой интерфейс (HUD) */
        #hud {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .panel {
            background: rgba(18, 14, 10, 0.88);
            border: 2px solid #8b6d43;
            border-radius: 6px;
            padding: 12px 16px;
            box-shadow: 0 0 15px rgba(0,0,0,0.9);
            pointer-events: auto;
            min-width: 200px;
        }
        .panel h2 {
            margin: 0 0 6px 0;
            font-size: 16px;
            color: #ff9d00;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #554228;
            padding-bottom: 4px;
        }
        .stat-row {
            font-size: 13px;
            margin: 6px 0;
            display: flex;
            justify-content: space-between;
        }
        .ap-badge {
            background: #2b7a3e;
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        #controls-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }
        .btn {
            background: #3a2a18;
            border: 2px solid #d4a359;
            color: #ffd89b;
            padding: 12px 22px;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
            transition: all 0.15s ease;
        }
        .btn:active {
            background: #8b6d43;
            color: #120e0a;
            transform: translateY(2px);
        }
        #log-box {
            position: absolute;
            bottom: 80px;
            left: 12px;
            width: 280px;
            max-height: 120px;
            overflow-y: auto;
            background: rgba(10, 8, 6, 0.8);
            border: 1px solid #554228;
            color: #a89474;
            font-size: 11px;
            padding: 8px;
            border-radius: 4px;
            pointer-events: none;
        }
        .log-entry { margin-bottom: 4px; }
        .log-entry.player { color: #5bc0be; }
        .log-entry.enemy { color: #ff5964; }
    </style>

    <!-- Three.js и OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="hud">
        <div class="panel" id="unit-info">
            <h2 id="unit-name">Выберите бойца</h2>
            <div class="stat-row">Класс: <span id="unit-class">-</span></div>
            <div class="stat-row">Здоровье (HP): <span id="unit-hp">-</span></div>
            <div class="stat-row">Очки Хода (AP): <span id="unit-ap" class="ap-badge">-</span></div>
        </div>
        <div class="panel" style="text-align: right;">
            <h2 style="color: #d4a359;">ПУСТОШЬ</h2>
            <div style="font-size: 12px; color: #8b6d43;" id="turn-display">ХОД ИГРОКА</div>
        </div>
    </div>

    <div id="log-box" id="log">
        <div class="log-entry">Тактический интерфейс запущен...</div>
        <div class="log-entry">Нажмите на бойца, затем на подсвеченную клетку.</div>
    </div>

    <div id="controls-panel">
        <button class="btn" id="end-turn-btn">Завершить ход</button>
    </div>

<script>
// --- КОНФИГУРАЦИЯ И СЦЕНА ---
const GRID_SIZE = 10;
const TILE_SIZE = 2;
const scene = new THREE.Scene();

// Мрачный песчаный туман (Grimdark Desert Fog)
scene.background = new THREE.Color(0x1a140e);
scene.fog = new THREE.FogExp2(0x1a140e, 0.025);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(10, 18, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('canvas-container').appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxPolarAngle = Math.PI / 2.1; // Не опускать камеру под землю
controls.target.set(GRID_SIZE * TILE_SIZE / 2 - TILE_SIZE/2, 0, GRID_SIZE * TILE_SIZE / 2 - TILE_SIZE/2);

// --- ОСВЕЩЕНИЕ ---
const ambientLight = new THREE.AmbientLight(0xd4a359, 0.4);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffdfa9, 1.2);
sunLight.position.set(15, 25, 10);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
scene.add(sunLight);

// --- ПЕСЧАНАЯ ПЛАТФОРМА И СЕТКА ---
const gridTiles = [];
const tilesGroup = new THREE.Group();
scene.add(tilesGroup);

const tileGeometry = new THREE.BoxGeometry(TILE_SIZE - 0.1, 0.2, TILE_SIZE - 0.1);

for (let x = 0; x < GRID_SIZE; x++) {
    gridTiles[x] = [];
    for (let z = 0; z < GRID_SIZE; z++) {
        const tileMaterial = new THREE.MeshStandardMaterial({
            color: 0x3d3021,
            roughness: 0.9,
            metalness: 0.1
        });
        const tile = new THREE.Mesh(tileGeometry, tileMaterial);
        tile.position.set(x * TILE_SIZE, -0.1, z * TILE_SIZE);
        tile.receiveShadow = true;
        tile.userData = { gridX: x, gridZ: z, isTile: true, defaultColor: 0x3d3021 };
        tilesGroup.add(tile);
        gridTiles[x][z] = tile;
    }
}

// Укрытия и руины на карте
function createCover(x, z, height = 1.2) {
    const geo = new THREE.BoxGeometry(TILE_SIZE * 0.8, height, TILE_SIZE * 0.8);
    const mat = new THREE.MeshStandardMaterial({ color: 0x261e15, roughness: 0.8 });
    const cover = new THREE.Mesh(geo, mat);
    cover.position.set(x * TILE_SIZE, height / 2, z * TILE_SIZE);
    cover.castShadow = true;
    cover.receiveShadow = true;
    scene.add(cover);
    gridTiles[x][z].userData.blocked = true;
}
createCover(3, 3);
createCover(3, 4);
createCover(6, 6);
createCover(7, 2, 1.8);

// --- БОЙЦЫ (3D-МОДЕЛИ ИЗ ПРИМИТИВОВ С НЕОНОВЫМИ ВИЗОРАМИ) ---
const units = [];
let selectedUnit = null;

function createUnitModel(color, visorColor, isHeavy = false) {
    const group = new THREE.Group();
    
    // Тело
    const bodyGeo = isHeavy ? new THREE.BoxGeometry(0.9, 1.2, 0.7) : new THREE.CylinderGeometry(0.35, 0.45, 1.1, 8);
    const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5, metalness: 0.5 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.6;
    body.castShadow = true;
    group.add(body);

    // Голова / Шлем
    const headGeo = new THREE.SphereGeometry(0.3, 12, 12);
    const headMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3 });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 1.35;
    head.castShadow = true;
    group.add(head);

    // Светящийся визор / глаза (Респиратор)
    const visorGeo = new THREE.SphereGeometry(0.1, 8, 8);
    const visorMat = new THREE.MeshBasicMaterial({ color: visorColor });
    
    const visorLeft = new THREE.Mesh(visorGeo, visorMat);
    visorLeft.position.set(-0.1, 1.38, 0.25);
    group.add(visorLeft);

    const visorRight = new THREE.Mesh(visorGeo, visorMat);
    visorRight.position.set(0.1, 1.38, 0.25);
    group.add(visorRight);

    // Точечный свет от визора
    const light = new THREE.PointLight(visorColor, 1.5, 3);
    light.position.set(0, 1.4, 0.4);
    group.add(light);

    return group;
}

class Unit {
    constructor(name, className, x, z, hp, maxAp, isEnemy, color, visorColor, isHeavy = false) {
        this.name = name;
        this.className = className;
        this.gridX = x;
        this.gridZ = z;
        this.hp = hp;
        this.maxHp = hp;
        this.ap = maxAp;
        this.maxAp = maxAp;
        this.isEnemy = isEnemy;
        
        this.mesh = createUnitModel(color, visorColor, isHeavy);
        this.mesh.position.set(x * TILE_SIZE, 0, z * TILE_SIZE);
        this.mesh.userData = { unit: this };
        scene.add(this.mesh);
    }

    moveTo(x, z) {
        const distance = Math.abs(this.gridX - x) + Math.abs(this.gridZ - z);
        if (this.ap >= distance && !gridTiles[x][z].userData.blocked) {
            this.gridX = x;
            this.gridZ = z;
            this.ap -= distance;
            
            // Анимация перемещения
            const targetPos = new THREE.Vector3(x * TILE_SIZE, 0, z * TILE_SIZE);
            const startPos = this.mesh.position.clone();
            let progress = 0;
            
            const animateMove = () => {
                progress += 0.08;
                if (progress < 1) {
                    this.mesh.position.lerpVectors(startPos, targetPos, progress);
                    requestAnimationFrame(animateMove);
                } else {
                    this.mesh.position.copy(targetPos);
                    updateUI();
                    highlightMoveRange();
                }
            };
            animateMove();
            
            addLog(`${this.name} переместился на [${x}, ${z}] (-${distance} AP)`, this.isEnemy ? 'enemy' : 'player');
            return true;
        }
        return false;
    }
}

// Спавн отряда Игрока
units.push(new Unit('Якуб', 'Штурмовик', 1, 1, 12, 4, false, 0x4a3b2c, 0xff0033));
units.push(new Unit('Малиус', 'Тяжелая броня', 2, 0, 20, 3, false, 0x2b382b, 0x00ff66, true));

// Спавн Врагов
units.push(new Unit('Кочевник-Мутант', 'Берсерк', 8, 8, 15, 4, true, 0x5a1818, 0xaa00ff));

// --- РЕЙКАСТИНГ И КЛИКИ (ПОДДЕРЖКА TOUCH / MOUSE) ---
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function onPointerDown(event) {
    const x = event.clientX || (event.touches && event.touches[0].clientX);
    const y = event.clientY || (event.touches && event.touches[0].clientY);
    
    if (!x || !y) return;

    mouse.x = (x / window.innerWidth) * 2 - 1;
    mouse.y = -(y / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(scene.children, true);

    for (let hit of intersects) {
        // Клик по юниту
        let parentGroup = hit.object.parent;
        while (parentGroup && !parentGroup.userData.unit) {
            parentGroup = parentGroup.parent;
        }
        if (parentGroup && parentGroup.userData.unit) {
            const clickedUnit = parentGroup.userData.unit;
            if (!clickedUnit.isEnemy) {
                selectedUnit = clickedUnit;
                addLog(`Выбран боец: ${selectedUnit.name}`, 'player');
                updateUI();
                highlightMoveRange();
                return;
            }
        }

        // Клик по клетке для хода
        if (hit.object.userData && hit.object.userData.isTile && selectedUnit) {
            const tileX = hit.object.userData.gridX;
            const tileZ = hit.object.userData.gridZ;
            selectedUnit.moveTo(tileX, tileZ);
            return;
        }
    }
}

window.addEventListener('pointerdown', onPointerDown);

// --- ПОДСВЕТКА ДОСТУПНЫХ КЛЕТОК ---
function highlightMoveRange() {
    // Сброс цвета всех клеток
    for (let x = 0; x < GRID_SIZE; x++) {
        for (let z = 0; z < GRID_SIZE; z++) {
            gridTiles[x][z].material.color.setHex(gridTiles[x][z].userData.defaultColor);
            gridTiles[x][z].material.emissive.setHex(0x000000);
        }
    }

    if (!selectedUnit || selectedUnit.ap <= 0) return;

    // Зеленая подсветка доступного радиуса хода
    for (let x = 0; x < GRID_SIZE; x++) {
        for (let z = 0; z < GRID_SIZE; z++) {
            const dist = Math.abs(selectedUnit.gridX - x) + Math.abs(selectedUnit.gridZ - z);
            if (dist <= selectedUnit.ap && dist > 0 && !gridTiles[x][z].userData.blocked) {
                gridTiles[x][z].material.color.setHex(0x2e5a3c);
                gridTiles[x][z].material.emissive.setHex(0x002200);
            }
        }
    }
}

// --- ИНТЕРФЕЙС И ЛОГИ ---
function updateUI() {
    if (selectedUnit) {
        document.getElementById('unit-name').innerText = selectedUnit.name;
        document.getElementById('unit-class').innerText = selectedUnit.className;
        document.getElementById('unit-hp').innerText = `${selectedUnit.hp} / ${selectedUnit.maxHp}`;
        document.getElementById('unit-ap').innerText = selectedUnit.ap;
    }
}

function addLog(text, type = '') {
    const logBox = document.getElementById('log-box');
    const entry = document.createElement('div');
    entry.className = `log-entry ${type}`;
    entry.innerText = `> ${text}`;
    logBox.appendChild(entry);
    logBox.scrollTop = logBox.scrollHeight;
}

// --- ПЕРЕДАЧА ХОДА И ИИ ВРАГОВ ---
document.getElementById('end-turn-btn').addEventListener('click', () => {
    // Сброс AP игрока
    units.filter(u => !u.isEnemy).forEach(u => u.ap = u.maxAp);
    addLog('Ход завершен. Ход противника...', 'enemy');
    document.getElementById('turn-display').innerText = 'ХОД ВРАГА';
    document.getElementById('turn-display').style.color = '#ff5964';

    // Простой ИИ Врага: делает шаг к ближайшему игроку
    setTimeout(() => {
        units.filter(u => u.isEnemy).forEach(enemy => {
            enemy.ap = enemy.maxAp;
            const target = units.find(u => !u.isEnemy);
            if (target) {
                let stepX = enemy.gridX + Math.sign(target.gridX - enemy.gridX);
                let stepZ = enemy.gridZ + Math.sign(target.gridZ - enemy.gridZ);
                enemy.moveTo(stepX, stepZ);
            }
        });

        document.getElementById('turn-display').innerText = 'ХОД ИГРОКА';
        document.getElementById('turn-display').style.color = '#8b6d43';
        if (selectedUnit) updateUI();
        highlightMoveRange();
    }, 1000);
});

// Адаптация под размер экрана
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- ГЛАВНЫЙ ИГРОВОЙ ЦИКЛ ---
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}
animate();

</script>
</body>
</html>
