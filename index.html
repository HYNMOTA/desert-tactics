### Как получить настоящую, крутую модель Якуба без ПК

У тебя на руках Quest 3s и телефон — этого более чем достаточно, чтобы заиметь честный 3D-ассет:

1. **Самый быстрый путь (Готовая качественная модель):**
   * Заходишь с телефона или шлема на [Sketchfab.com](https://sketchfab.com).
   * Вбиваешь в поиск `Gas Mask Soldier`, `Post Apocalyptic Nomad` или `Cyberpunk Nomad` и ставишь фильтр **Downloadable** + **Free**.
   * Скачиваешь понравившуюся модель в формате `.glb` или `.gltf`.
   * *(Опционально)* Заходишь на **Mixamo.com**, загружаешь модель, и сайт бесплатно накладывает на нее скелет с анимациями бега и ожидания.
2. **Загрузка на GitHub:**
   * В репозитории создаешь папку `models` и загружаешь туда скачанный файл с именем `yakub.glb`.

function createCover(x, z, height = 1.3) {
    const geo = new THREE.BoxGeometry(TILE_SIZE * 0.8, height, TILE_SIZE * 0.8);
    const mat = new THREE.MeshStandardMaterial({ color: 0x282017, roughness: 0.9 });

    moveTo(x, z) {

            this.gridZ = z;
            this.ap -= distance;

            const angle = Math.atan2(x - startPos.x / TILE_SIZE, z - startPos.z / TILE_SIZE);
            if (distance > 0) this.mesh.rotation.y = angle;

            const animateMove = () => {
                progress += 0.08;
                if (progress < 1) {

                    requestAnimationFrame(animateMove);

                    this.mesh.position.copy(targetPos);
                    updateUI();
                    highlightMoveRange();
                }
            };
            animateMove();

        }
        return false;

                if (node.isMesh) {
                    node.castShadow = true;
                    node.receiveShadow = true;
                }
            });

            // Авто-подгонка размера под клетку

            yakub.mesh.add(model);

            // Обработка анимации (если есть скелет)
            if (gltf.animations && gltf.animations.length > 0) {
                const mixer = new THREE.AnimationMixer(model);
                const idleAction = mixer.clipAction(gltf.animations[0]);
                idleAction.play();
                animationMixers.push(mixer);
            }

            addLog('Файл models/yakub.glb успешно загружен!', 'player');
        },
        (xhr) => {
            if (xhr.total > 0) {

            }
        },
        (error) => {

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function onPointerDown(event) {
    const x = event.clientX || (event.touches && event.touches[0].clientX);
    const y = event.clientY || (event.touches && event.touches[0].clientY);
    
    if (!x || !y) return;

    mouse.x = (x / window.innerWidth) * 2 - 1;
    mouse.y = -(y / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(scene.children, true);

    for (let hit of intersects) {
        if (hit.object.userData && hit.object.userData.isTile && selectedUnit) {
            const tileX = hit.object.userData.gridX;
            const tileZ = hit.object.userData.gridZ;
            selectedUnit.moveTo(tileX, tileZ);
            return;
        }
    }
}

window.addEventListener('pointerdown', onPointerDown);

function highlightMoveRange() {
    for (let x = 0; x < GRID_SIZE; x++) {

            gridTiles[x][z].material.color.setHex(gridTiles[x][z].userData.defaultColor);
            gridTiles[x][z].material.emissive.setHex(0x000000);

    }

    if (!selectedUnit || selectedUnit.ap <= 0) return;

    for (let x = 0; x < GRID_SIZE; x++) {
        for (let z = 0; z < GRID_SIZE; z++) {
            const dist = Math.abs(selectedUnit.gridX - x) + Math.abs(selectedUnit.gridZ - z);
            if (dist <= selectedUnit.ap && dist > 0 && !gridTiles[x][z].userData.blocked) {
                gridTiles[x][z].material.color.setHex(0x2e5a3c);
                gridTiles[x][z].material.emissive.setHex(0x002200);
            }
        }
    }
}

    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    
    // Обновление скелетных анимаций
    for (let mixer of animationMixers) {
        mixer.update(delta);
    }

    controls.update();
    renderer.render(scene, camera);
}
animate();

</script>
