<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HYNMOTA: Desert Tactics 3D</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { margin: 0; padding: 0; overflow: hidden; background-color: #080604; font-family: 'Courier New', monospace; color: #d4a359; }
        
        #canvas-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1; display: block;
        }
        
        #error-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(25, 5, 5, 0.95); color: #ff5555; font-family: monospace;
            padding: 20px; z-index: 9999; display: none; overflow: auto; font-size: 12px;
        }

        /* ЭКРАН КОНЕЦ ИГРЫ (MODAL) */
        #game-over-modal {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 100;
            background: rgba(8, 5, 3, 0.92); display: none; justify-content: center; align-items: center;
            text-align: center;
        }
        .modal-box {
            background: rgba(20, 14, 9, 0.96); border: 3px solid #8b6d43; border-radius: 10px;
            padding: 30px 40px; box-shadow: 0 0 35px rgba(255, 157, 0, 0.3); max-width: 90vw; width: 380px;
        }
        .modal-box h1 { margin: 0 0 10px 0; font-size: 26px; text-transform: uppercase; letter-spacing: 2px; }
        .modal-box p { font-size: 14px; color: #d4a359; margin-bottom: 24px; line-height: 1.4; }
        .btn-restart {
            background: #8b6d43; border: 2px solid #ffd89b; color: #120e0a; font-size: 15px;
            width: 100%; padding: 14px; font-weight: bold; cursor: pointer; border-radius: 6px;
            text-transform: uppercase; box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        .btn-restart:active { transform: translateY(2px); background: #a68453; }

        #hud {
            position: absolute; top: 12px; left: 12px; right: 12px; z-index: 10;
            pointer-events: none; display: flex; justify-content: space-between; align-items: flex-start;
        }
        .panel {
            background: rgba(15, 11, 8, 0.94); border: 2px solid #8b6d43; border-radius: 6px;
            padding: 12px 16px; box-shadow: 0 0 20px rgba(0,0,0,0.95); pointer-events: auto; min-width: 200px;
        }
        .panel h2 { margin: 0 0 6px 0; font-size: 15px; color: #ff9d00; text-transform: uppercase; border-bottom: 1px solid #554228; padding-bottom: 4px; }
        .stat-row { font-size: 13px; margin: 6px 0; display: flex; justify-content: space-between; }
        .ap-badge { background: #2b7a3e; color: #fff; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        
        #target-panel {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
            display: none; background: rgba(25, 10, 10, 0.95); border: 2px solid #ff3333;
            border-radius: 6px; padding: 12px 20px; text-align: center; pointer-events: auto;
        }
        #target-panel h3 { margin: 0 0 4px 0; color: #ff5964; font-size: 14px; }
        .hit-rate { font-size: 16px; font-weight: bold; color: #00ff66; margin: 6px 0; }
        
        #controls-panel {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
            display: flex; gap: 8px; pointer-events: auto; flex-wrap: wrap; justify-content: center;
        }
        .btn {
            background: #3a2a18; border: 2px solid #d4a359; color: #ffd89b; padding: 12px 18px;
            font-family: inherit; font-size: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; text-transform: uppercase;
        }
        .btn-shoot { background: #611818; border-color: #ff3333; color: #ffcccc; }
        .btn-melee { background: #4a1f1a; border-color: #ff6633; color: #ffddcc; }
        .btn-ability { background: #12354a; border-color: #00ccff; color: #ccf5ff; }
        .btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .btn:active:not(:disabled) { transform: translateY(2px); }

        #log-box {
            position: absolute; bottom: 85px; left: 12px; z-index: 10; width: 330px; max-height: 135px;
            overflow-y: auto; background: rgba(10, 8, 6, 0.92); border: 1px solid #554228;
            color: #a89474; font-size: 11px; padding: 8px; border-radius: 4px; pointer-events: none;
        }
        .log-entry { margin-bottom: 4px; }
        .log-entry.player { color: #5bc0be; }
        .log-entry.enemy { color: #ff5964; font-weight: bold; }
        .log-entry.hit { color: #00ff66; font-weight: bold; }
        .log-entry.ability { color: #00ccff; font-weight: bold; }
        .log-entry.melee { color: #ff6633; font-weight: bold; }

        #floating-text-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 20;
            pointer-events: none; overflow: hidden;
        }
        .dmg-text {
            position: absolute; font-family: 'Impact', sans-serif; font-size: 24px;
            font-weight: bold; text-shadow: 0 0 6px #000, 2px 2px 0 #000;
            transition: transform 0.8s ease-out, opacity 0.8s ease-out;
            will-change: transform, opacity;
        }
    </style>

    <script>
        window.addEventListener('error', function(e) {
            var errBox = document.getElementById('error-overlay');
            if (errBox) {
                errBox.style.display = 'block';
                errBox.innerHTML += '<div><b>[СБОЙ]:</b> ' + e.message + '</div>';
            }
        });
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="error-overlay"><h3>ОШИБКА ОТРИСОВКИ:</h3></div>
    <div id="canvas-container"></div>
    <div id="floating-text-container"></div>

    <!-- МОДАЛЬНОЕ ОКНО "КОНЕЦ ИГРЫ" -->
    <div id="game-over-modal">
        <div class="modal-box">
            <h1 id="modal-title">ПОРАЖЕНИЕ</h1>
            <p id="modal-msg">Якуб пал в бою против Ревы.</p>
            <button class="btn-restart" id="restart-btn">НАЧАТЬ ЗАНОВО</button>
        </div>
    </div>

    <div id="hud">
        <div class="panel">
            <h2 id="unit-name">Якуб</h2>
            <div class="stat-row">Класс: <span id="unit-class">Штурмовик</span></div>
            <div class="stat-row">HP: <span id="unit-hp">12 / 12</span></div>
            <div class="stat-row">AP: <span id="unit-ap" class="ap-badge">4</span></div>
        </div>
        <div class="panel" style="text-align: right;">
            <h2 style="color: #d4a359;">HYNMOTA 3D</h2>
            <div style="font-size: 12px; color: #ff9d00;" id="turn-display">ХОД ИГРОКА</div>
        </div>
    </div>

    <div id="target-panel">
        <h3 id="target-name">Цель: Рева</h3>
        <div style="font-size: 11px; color: #aaa;" id="target-cover">Защита: Нет</div>
        <div class="hit-rate" id="hit-chance">Шанс: 85%</div>
        <button class="btn btn-shoot" id="shoot-btn">ОГОНЬ (-2 AP)</button>
    </div>

    <div id="log-box">
        <div class="log-entry">Тактическая система обновлена.</div>
        <div class="log-entry">Макс. дальность стрельбы: 4 клетки. Ближний бой: 1 клетка.</div>
    </div>

    <div id="controls-panel">
        <button class="btn btn-melee" id="melee-btn">Ближний бой (-2 AP)</button>
        <button class="btn btn-ability" id="cyber-pulse-btn">Кибер-Импульс (-2 AP)</button>
        <button class="btn" id="end-turn-btn">Завершить ход</button>
    </div>

<script>
// --- ИНИЦИАЛИЗА 3D-СЦЕНЫ ---
const GRID_SIZE = 10;
const TILE_SIZE = 2;
const MAX_SHOOT_RANGE = 4; // Максимальная дальность стрельбы
const scene = new THREE.Scene();

scene.background = new THREE.Color(0x16100a);
scene.fog = new THREE.FogExp2(0x16100a, 0.022);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(10, 16, 20);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('canvas-container').appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(GRID_SIZE * TILE_SIZE / 2 - TILE_SIZE / 2, 0, GRID_SIZE * TILE_SIZE / 2 - TILE_SIZE / 2);

// --- ОСВЕЩЕНИЕ ---
const ambientLight = new THREE.AmbientLight(0xd4a359, 0.6);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffdfa9, 1.3);
sunLight.position.set(15, 25, 10);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 1024;
sunLight.shadow.mapSize.height = 1024;
scene.add(sunLight);

const rimLight = new THREE.DirectionalLight(0x3a556a, 0.7);
rimLight.position.set(-15, 12, -10);
scene.add(rimLight);

// --- СЕТКА И УБЕДИТЕЛЬНЫЕ ТЕКСТУРЫ ---
const tileBaseMat = new THREE.MeshLambertMaterial({ color: 0x322518 });
const tileEdgeMat = new THREE.MeshBasicMaterial({ color: 0x5a442e, wireframe: true });
const coverMat = new THREE.MeshStandardMaterial({ color: 0x221a12, roughness: 0.85, metalness: 0.2 });
const coverMetalMat = new THREE.MeshStandardMaterial({ color: 0x3d2b1d, roughness: 0.5, metalness: 0.6 });

const gridTiles = [];
const tileGeo = new THREE.BoxGeometry(TILE_SIZE - 0.08, 0.2, TILE_SIZE - 0.08);

for (let x = 0; x < GRID_SIZE; x++) {
    gridTiles[x] = [];
    for (let z = 0; z < GRID_SIZE; z++) {
        const tileMesh = new THREE.Mesh(tileGeo, tileBaseMat.clone());
        tileMesh.position.set(x * TILE_SIZE, -0.1, z * TILE_SIZE);
        tileMesh.receiveShadow = true;
        
        const wireframe = new THREE.LineSegments(
            new THREE.EdgesGeometry(tileGeo),
            tileEdgeMat
        );
        tileMesh.add(wireframe);

        tileMesh.userData = { gridX: x, gridZ: z, isTile: true, defaultColor: 0x322518 };
        scene.add(tileMesh);
        gridTiles[x][z] = tileMesh;
    }
}

// УКРЫТИЯ
function createCover(x, z, height = 1.3) {
    const group = new THREE.Group();
    const geo = new THREE.BoxGeometry(TILE_SIZE * 0.82, height, TILE_SIZE * 0.82);
    const coverMesh = new THREE.Mesh(geo, coverMat);
    coverMesh.position.y = height / 2;
    coverMesh.castShadow = true;
    coverMesh.receiveShadow = true;
    group.add(coverMesh);

    const topCap = new THREE.Mesh(new THREE.BoxGeometry(TILE_SIZE * 0.86, 0.1, TILE_SIZE * 0.86), coverMetalMat);
    topCap.position.y = height + 0.05;
    topCap.castShadow = true;
    group.add(topCap);

    group.position.set(x * TILE_SIZE, 0, z * TILE_SIZE);
    scene.add(group);

    gridTiles[x][z].userData.blocked = true;
    gridTiles[x][z].userData.isCover = true;
}

createCover(3, 3, 1.2);
createCover(3, 4, 1.2);
createCover(6, 6, 1.8);
createCover(2, 7, 1.4);

// --- ЭФФЕКТЫ (VFX) ---
function spawnTracer(startPos, endPos, isHit) {
    const points = [startPos.clone().add(new THREE.Vector3(0, 1.2, 0)), endPos.clone().add(new THREE.Vector3(0, 1.0, 0))];
    const geometry = new THREE.BufferGeometry().setFromPoints(points);
    const material = new THREE.LineBasicMaterial({ color: isHit ? 0xffaa00 : 0xff3300, linewidth: 3 });
    const line = new THREE.Line(geometry, material);
    scene.add(line);

    const flash = new THREE.PointLight(0xffaa00, 4, 3);
    flash.position.copy(points[0]);
    scene.add(flash);

    setTimeout(() => { scene.remove(line); scene.remove(flash); }, 140);
}

// Эффект ближнего боя (Меч/Клинок)
function spawnMeleeVFX(startPos, targetPos) {
    const midPos = new THREE.Vector3().addVectors(startPos, targetPos).multiplyScalar(0.5);
    midPos.y += 1.0;

    const ringGeo = new THREE.RingGeometry(0.1, 1.2, 16);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xff6633, side: THREE.DoubleSide, transparent: true, opacity: 1 });
    const slash = new THREE.Mesh(ringGeo, ringMat);
    slash.position.copy(midPos);
    slash.rotation.x = Math.PI / 3;
    scene.add(slash);

    const flash = new THREE.PointLight(0xffaa00, 5, 3);
    flash.position.copy(midPos);
    scene.add(flash);

    let op = 1;
    const anim = () => {
        op -= 0.12;
        ringMat.opacity = op;
        if (op > 0) requestAnimationFrame(anim);
        else { scene.remove(slash); scene.remove(flash); }
    };
    anim();
}

function spawnCyberPulseVFX(pos) {
    const ringGeo = new THREE.RingGeometry(0.2, 1.8, 32);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ccff, side: THREE.DoubleSide, transparent: true, opacity: 1 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2;
    ring.position.set(pos.x, 0.1, pos.z);
    scene.add(ring);

    const flash = new THREE.PointLight(0x00ccff, 6, 4);
    flash.position.set(pos.x, 1.2, pos.z);
    scene.add(flash);

    let scale = 1;
    const animatePulse = () => {
        scale += 0.15;
        ring.scale.set(scale, scale, scale);
        ringMat.opacity -= 0.08;
        if (ringMat.opacity > 0) requestAnimationFrame(animatePulse);
        else { scene.remove(ring); scene.remove(flash); }
    };
    animatePulse();
}

function showFloatingText(text, worldPos, color = '#ff3333') {
    const el = document.createElement('div');
    el.className = 'dmg-text';
    el.innerText = text;
    el.style.color = color;

    const vector = worldPos.clone().add(new THREE.Vector3(0, 1.8, 0));
    vector.project(camera);

    const x = (vector.x * .5 + .5) * window.innerWidth;
    const y = (-(vector.y * .5) + .5) * window.innerHeight;

    el.style.left = `${x}px`;
    el.style.top = `${y}px`;
    document.getElementById('floating-text-container').appendChild(el);

    requestAnimationFrame(() => {
        el.style.transform = 'translateY(-40px) scale(1.2)';
        el.style.opacity = '0';
    });

    setTimeout(() => { el.remove(); }, 800);
}

// --- ЮНИТЫ ---
let units = [];
let selectedUnit = null;
let currentTarget = null;
let isEnemyTurn = false;
let isGameOver = false;

class Unit {
    constructor(name, className, x, z, hp, maxAp, isEnemy, visorColor = 0x00ff66, bodyColor = 0x4a2a2a) {
        this.name = name;
        this.className = className;
        this.startX = x;
        this.startZ = z;
        this.gridX = x;
        this.gridZ = z;
        this.hp = hp;
        this.maxHp = hp;
        this.ap = maxAp;
        this.maxAp = maxAp;
        this.isEnemy = isEnemy;
        this.isStunned = false;

        this.mesh = new THREE.Group();
        this.mesh.position.set(x * TILE_SIZE, 0, z * TILE_SIZE);

        const bodyGeo = new THREE.CylinderGeometry(0.35, 0.35, 1.4, 12);
        const bodyMat = new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.5 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.7;
        body.castShadow = true;
        this.mesh.add(body);

        const visorGeo = new THREE.SphereGeometry(0.12, 12, 12);
        const visorMat = new THREE.MeshBasicMaterial({ color: visorColor });
        const visor = new THREE.Mesh(visorGeo, visorMat);
        visor.position.set(0, 1.25, 0.3);
        this.mesh.add(visor);

        const vLight = new THREE.PointLight(visorColor, 2.5, 3.5);
        vLight.position.set(0, 1.25, 0.35);
        this.mesh.add(vLight);

        this.mesh.userData = { unit: this };
        scene.add(this.mesh);
    }

    moveTo(x, z) {
        const distance = Math.abs(this.gridX - x) + Math.abs(this.gridZ - z);
        if (this.ap >= distance && !gridTiles[x][z].userData.blocked) {
            this.gridX = x;
            this.gridZ = z;
            this.ap -= distance;
            
            this.mesh.position.set(x * TILE_SIZE, 0, z * TILE_SIZE);
            closeTargetPanel();
            updateUI();
            highlightMoveRange();
            addLog(`${this.name} переместился на [${x}, ${z}] (-${distance} AP)`, this.isEnemy ? 'enemy' : 'player');
            return true;
        }
        return false;
    }

    takeDamage(amount) {
        this.hp -= amount;
        if (this.hp <= 0) {
            this.hp = 0;
            scene.remove(this.mesh);
            const index = units.indexOf(this);
            if (index > -1) units.splice(index, 1);
            
            closeTargetPanel();

            // Проверка условий КОНЕЦ ИГРЫ
            if (this.name === 'Якуб') {
                triggerGameOver(false); // Поражение
            } else if (this.name === 'Рева') {
                triggerGameOver(true); // Победа
            }
        }
    }

    resetUnit() {
        this.hp = this.maxHp;
        this.ap = this.maxAp;
        this.gridX = this.startX;
        this.gridZ = this.startZ;
        this.isStunned = false;
        this.mesh.position.set(this.startX * TILE_SIZE, 0, this.startZ * TILE_SIZE);
        scene.add(this.mesh);
    }
}

// Спавн
const yakub = new Unit('Якуб', 'Штурмовик', 1, 1, 12, 4, false, 0xff0033, 0x3d3226);
const reva = new Unit('Рева', 'Техно-Специалист', 7, 7, 16, 4, true, 0x00ff66, 0x223322);

units.push(yakub, reva);
selectedUnit = yakub;

// Загрузка GLB
function loadModelSafely(unitObj, modelPath, visorColor) {
    if (typeof THREE.GLTFLoader === 'undefined') return;

    const loader = new THREE.GLTFLoader();
    loader.load(
        modelPath,
        (gltf) => {
            try {
                unitObj.mesh.clear();
                const model = gltf.scene;
                model.scale.set(1.1, 1.1, 1.1);
                model.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
                unitObj.mesh.add(model);

                const vLight = new THREE.PointLight(visorColor, 3, 3);
                vLight.position.set(0, 1.5, 0.3);
                unitObj.mesh.add(vLight);
                addLog(`Файл ${modelPath} подключен!`, 'player');
            } catch (err) { console.error(err); }
        },
        null,
        () => { addLog(`Загрузка ${modelPath}: используется 3D-аватар.`, 'player'); }
    );
}

loadModelSafely(yakub, './models/yakub.glb', 0xff0033);
loadModelSafely(reva, './models/reva.glb', 0x00ff66);

// РАСЧЕТ ШАНСА ПОПАДАНИЯ И ОГРАНИЧЕНИЕ 4 КЛЕТКИ
function calculateHitChance(attacker, target) {
    const dist = Math.abs(attacker.gridX - target.gridX) + Math.abs(attacker.gridZ - target.gridZ);

    if (dist > MAX_SHOOT_RANGE) {
        return { chance: 0, cover: 'Слишком далеко (>4 кл.)', outOfRange: true, distance: dist };
    }

    let baseChance = 85;
    let coverType = 'Нет (85%)';

    const dx = Math.sign(attacker.gridX - target.gridX);
    const dz = Math.sign(attacker.gridZ - target.gridZ);

    const checkX = target.gridX + dx;
    const checkZ = target.gridZ + dz;

    if (checkX >= 0 && checkX < GRID_SIZE && gridTiles[checkX][target.gridZ].userData.isCover) {
        baseChance = 45;
        coverType = 'Укрытие (45%)';
    } else if (checkZ >= 0 && checkZ < GRID_SIZE && gridTiles[target.gridX][checkZ].userData.isCover) {
        baseChance = 45;
        coverType = 'Укрытие (45%)';
    }

    return { chance: baseChance, cover: coverType, outOfRange: false, distance: dist };
}

// КЛИКИ И УПРАВЛЕНИЕ
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function onPointerDown(event) {
    if (isEnemyTurn || isGameOver) return;

    const x = event.clientX || (event.touches && event.touches[0].clientX);
    const y = event.clientY || (event.touches && event.touches[0].clientY);
    if (!x || !y) return;

    mouse.x = (x / window.innerWidth) * 2 - 1;
    mouse.y = -(y / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(scene.children, true);

    for (let hit of intersects) {
        let parentGroup = hit.object.parent;
        while (parentGroup && !parentGroup.userData.unit) parentGroup = parentGroup.parent;

        if (parentGroup && parentGroup.userData.unit) {
            const unit = parentGroup.userData.unit;
            if (unit.isEnemy) {
                currentTarget = unit;
                openTargetPanel(unit);
                return;
            }
        }

        if (hit.object.userData && hit.object.userData.isTile && selectedUnit) {
            selectedUnit.moveTo(hit.object.userData.gridX, hit.object.userData.gridZ);
            return;
        }
    }
}

window.addEventListener('pointerdown', onPointerDown);

function openTargetPanel(target) {
    const calc = calculateHitChance(selectedUnit, target);
    const shootBtn = document.getElementById('shoot-btn');
    
    document.getElementById('target-panel').style.display = 'block';
    document.getElementById('target-name').innerText = `Цель: ${target.name} [HP: ${target.hp}/${target.maxHp}]`;
    document.getElementById('target-cover').innerText = `Защита: ${calc.cover}`;

    if (calc.outOfRange) {
        document.getElementById('hit-chance').innerText = `ВНЕ ЗОНЫ (Дист: ${calc.distance}/4)`;
        document.getElementById('hit-chance').style.color = '#ff5964';
        shootBtn.disabled = true;
    } else {
        document.getElementById('hit-chance').innerText = `Шанс: ${calc.chance}% (Дист: ${calc.distance} кл.)`;
        document.getElementById('hit-chance').style.color = '#00ff66';
        shootBtn.disabled = false;
    }
}

function closeTargetPanel() {
    document.getElementById('target-panel').style.display = 'none';
    currentTarget = null;
}

// ВЫСТРЕЛ
document.getElementById('shoot-btn').addEventListener('click', () => {
    if (!selectedUnit || !currentTarget || isEnemyTurn || isGameOver) return;

    if (selectedUnit.ap < 2) {
        addLog('Недостаточно AP для выстрела! (Нужно 2 AP)', 'enemy');
        return;
    }

    const calc = calculateHitChance(selectedUnit, currentTarget);
    if (calc.outOfRange) {
        addLog('Цель слишком далеко! Максимальная дальность стрельбы — 4 клетки.', 'enemy');
        return;
    }

    selectedUnit.ap -= 2;
    const roll = Math.floor(Math.random() * 100);
    const isHit = roll < calc.chance;

    spawnTracer(selectedUnit.mesh.position, currentTarget.mesh.position, isHit);

    if (isHit) {
        const damage = Math.floor(Math.random() * 3) + 4;
        showFloatingText(`-${damage}`, currentTarget.mesh.position, '#ff3333');
        addLog(`ПОПАДАНИЕ! ${selectedUnit.name} нанес ${damage} урона по ${currentTarget.name}!`, 'hit');
        currentTarget.takeDamage(damage);
    } else {
        showFloatingText('ПРОМАХ!', currentTarget.mesh.position, '#ffcc00');
        addLog(`${selectedUnit.name} ПРОМАХНУЛСЯ по ${currentTarget.name}!`, 'enemy');
    }

    updateUI();
    highlightMoveRange();
    if (currentTarget && currentTarget.hp > 0) openTargetPanel(currentTarget);
});

// БЛИЖНИЙ БОЙ (1 КВЕТКА)
document.getElementById('melee-btn').addEventListener('click', () => {
    if (!selectedUnit || isEnemyTurn || isGameOver) return;

    if (selectedUnit.ap < 2) {
        addLog('Недостаточно AP для ближнего боя! (Нужно 2 AP)', 'enemy');
        return;
    }

    // Ищем врага ровно на расстоянии 1 клетки
    const target = units.find(u => u.isEnemy && (Math.abs(u.gridX - selectedUnit.gridX) + Math.abs(u.gridZ - selectedUnit.gridZ)) === 1);

    if (!target) {
        addLog('Ближний бой доступен только вплотную! (Дистанция 1 клетка)', 'enemy');
        return;
    }

    selectedUnit.ap -= 2;
    const damage = Math.floor(Math.random() * 4) + 5; // 5-8 урона

    // Поворот к цели
    const dx = target.gridX - selectedUnit.gridX;
    const dz = target.gridZ - selectedUnit.gridZ;
    selectedUnit.mesh.rotation.y = Math.atan2(dx, dz);

    spawnMeleeVFX(selectedUnit.mesh.position, target.mesh.position);
    showFloatingText(`УДАР! -${damage}`, target.mesh.position, '#ff6633');
    
    addLog(`БЛИЖНИЙ БОЙ! ${selectedUnit.name} нанес ${damage} урона клинком по ${target.name}!`, 'melee');
    target.takeDamage(damage);

    updateUI();
    highlightMoveRange();
});

// КИБЕР-ИМПУЛЬС
document.getElementById('cyber-pulse-btn').addEventListener('click', () => {
    if (!selectedUnit || isEnemyTurn || isGameOver) return;

    if (selectedUnit.ap < 2) {
        addLog('Недостаточно AP для Кибер-импульса!', 'enemy');
        return;
    }

    const nearbyEnemy = units.find(u => u.isEnemy && (Math.abs(u.gridX - selectedUnit.gridX) + Math.abs(u.gridZ - selectedUnit.gridZ)) <= 2);

    if (!nearbyEnemy) {
        addLog('Враг слишком далеко! Подойдите ближе (радиус 2 клетки).', 'enemy');
        return;
    }

    selectedUnit.ap -= 2;
    const damage = Math.floor(Math.random() * 3) + 6;

    spawnCyberPulseVFX(nearbyEnemy.mesh.position);
    showFloatingText(`ОГЛУШЕНИЕ! -${damage}`, nearbyEnemy.mesh.position, '#00ccff');
    
    nearbyEnemy.isStunned = true;
    nearbyEnemy.ap = 0;
    nearbyEnemy.takeDamage(damage);

    addLog(`КИБЕР-ИМПУЛЬС! ${nearbyEnemy.name} ОГЛУШЕНА (-${damage} HP)!`, 'ability');

    updateUI();
    highlightMoveRange();
});

// ИИ ВРАГА (РЕВА)
async function runEnemyAI() {
    if (isGameOver) return;

    isEnemyTurn = true;
    closeTargetPanel();
    document.getElementById('turn-display').innerText = 'ХОД ВРАГА';
    document.getElementById('turn-display').style.color = '#ff5964';
    document.getElementById('end-turn-btn').disabled = true;

    const enemies = units.filter(u => u.isEnemy);

    for (let enemyUnit of enemies) {
        if (enemyUnit.hp <= 0 || isGameOver) continue;

        if (enemyUnit.isStunned) {
            addLog(`${enemyUnit.name} ОГЛУШЕНА и пропускает ход!`, 'enemy');
            showFloatingText('ПРОПУСК', enemyUnit.mesh.position, '#00ccff');
            enemyUnit.isStunned = false;
            await new Promise(r => setTimeout(r, 1000));
            continue;
        }

        enemyUnit.ap = enemyUnit.maxAp;

        while (enemyUnit.ap > 0 && yakub.hp > 0 && !isGameOver) {
            await new Promise(r => setTimeout(r, 800));

            const distToPlayer = Math.abs(enemyUnit.gridX - yakub.gridX) + Math.abs(enemyUnit.gridZ - yakub.gridZ);

            // 1. Если ИИ вплотную (1 клетка) -> АТАКА БЛИЖНЕГО БОЯ
            if (distToPlayer === 1 && enemyUnit.ap >= 2) {
                enemyUnit.ap -= 2;
                const damage = Math.floor(Math.random() * 3) + 4; // 4-6 урона

                spawnMeleeVFX(enemyUnit.mesh.position, yakub.mesh.position);
                showFloatingText(`УДАР! -${damage}`, yakub.mesh.position, '#ff5964');
                addLog(`РЕВА НАНОСИТ УДАР ВПЛОТНУЮ! Якуб получил ${damage} урона!`, 'enemy');
                yakub.takeDamage(damage);
            }
            // 2. Если в пределах 4 клеток -> СТРЕЛЬБА
            else if (distToPlayer <= MAX_SHOOT_RANGE && enemyUnit.ap >= 2) {
                enemyUnit.ap -= 2;

                const calc = calculateHitChance(enemyUnit, yakub);
                const roll = Math.floor(Math.random() * 100);
                const isHit = roll < calc.chance;

                const dx = yakub.gridX - enemyUnit.gridX;
                const dz = yakub.gridZ - enemyUnit.gridZ;
                enemyUnit.mesh.rotation.y = Math.atan2(dx, dz);

                spawnTracer(enemyUnit.mesh.position, yakub.mesh.position, isHit);

                if (isHit) {
                    const damage = Math.floor(Math.random() * 3) + 3;
                    showFloatingText(`-${damage}`, yakub.mesh.position, '#ff3333');
                    addLog(`РЕВА СТРЕЛЯЕТ! Попадание по Якубу (-${damage} HP)!`, 'enemy');
                    yakub.takeDamage(damage);
                } else {
                    showFloatingText('ПРОМАХ!', yakub.mesh.position, '#ffcc00');
                    addLog(`Рева выстрелила и промахнулась!`, 'player');
                }
            } 
            // 3. Иначе -> СОКРАЩЕНИЕ ДИСТАНЦИИ
            else if (enemyUnit.ap > 0) {
                let stepX = enemyUnit.gridX + Math.sign(yakub.gridX - enemyUnit.gridX);
                let stepZ = enemyUnit.gridZ + Math.sign(yakub.gridZ - enemyUnit.gridZ);

                if (!gridTiles[stepX][stepZ].userData.blocked) {
                    enemyUnit.moveTo(stepX, stepZ);
                    addLog(`${enemyUnit.name} маневрирует ближе к Якубу.`, 'enemy');
                } else {
                    break;
                }
            } else {
                break;
            }
        }
    }

    if (!isGameOver) {
        isEnemyTurn = false;
        document.getElementById('turn-display').innerText = 'ХОД ИГРОКА';
        document.getElementById('turn-display').style.color = '#ff9d00';
        document.getElementById('end-turn-btn').disabled = false;

        if (selectedUnit) selectedUnit.ap = selectedUnit.maxAp;
        updateUI();
        highlightMoveRange();
        addLog('Ваш ход! AP восстановлены.', 'player');
    }
}

document.getElementById('end-turn-btn').addEventListener('click', () => {
    if (!isEnemyTurn && !isGameOver) runEnemyAI();
});

// ТАБЛИЧКА "КОНЕЦ ИГРЫ"
function triggerGameOver(isVictory) {
    isGameOver = true;
    closeTargetPanel();

    const modal = document.getElementById('game-over-modal');
    const title = document.getElementById('modal-title');
    const msg = document.getElementById('modal-msg');

    if (isVictory) {
        title.innerText = 'ПОБЕДА!';
        title.style.color = '#00ff66';
        msg.innerText = 'Рева повержена! Пустошь под вашим контролем.';
    } else {
        title.innerText = 'ПОРАЖЕНИЕ';
        title.style.color = '#ff3333';
        msg.innerText = 'Якуб пал в бою... Ваша миссия провалена.';
    }

    modal.style.display = 'flex';
}

// КНОПКА "НАЧАТЬ ЗАНОВО"
document.getElementById('restart-btn').addEventListener('click', () => {
    document.getElementById('game-over-modal').style.display = 'none';
    isGameOver = false;
    isEnemyTurn = false;

    // Перезапуск всех бойцов
    if (!units.includes(yakub)) units.push(yakub);
    if (!units.includes(reva)) units.push(reva);

    yakub.resetUnit();
    reva.resetUnit();

    selectedUnit = yakub;
    document.getElementById('turn-display').innerText = 'ХОД ИГРОКА';
    document.getElementById('turn-display').style.color = '#ff9d00';
    document.getElementById('end-turn-btn').disabled = false;

    updateUI();
    highlightMoveRange();
    addLog('--- НОВЫЙ БОЙ НАЧАТ ---', 'player');
});

// ПОДСВЕТКА СЕТКИ
function highlightMoveRange() {
    for (let x = 0; x < GRID_SIZE; x++) {
        for (let z = 0; z < GRID_SIZE; z++) {
            gridTiles[x][z].material.color.setHex(gridTiles[x][z].userData.defaultColor);
        }
    }

    if (!selectedUnit || selectedUnit.ap <= 0 || isEnemyTurn || isGameOver) return;

    for (let x = 0; x < GRID_SIZE; x++) {
        for (let z = 0; z < GRID_SIZE; z++) {
            const dist = Math.abs(selectedUnit.gridX - x) + Math.abs(selectedUnit.gridZ - z);
            if (dist <= selectedUnit.ap && dist > 0 && !gridTiles[x][z].userData.blocked) {
                gridTiles[x][z].material.color.setHex(0x1e4a2c);
            }
        }
    }
}
highlightMoveRange();

function updateUI() {
    if (selectedUnit) {
        document.getElementById('unit-name').innerText = selectedUnit.name;
        document.getElementById('unit-hp').innerText = `${selectedUnit.hp} / ${selectedUnit.maxHp}`;
        document.getElementById('unit-ap').innerText = selectedUnit.ap;
    }
}

function addLog(text, type = '') {
    const logBox = document.getElementById('log-box');
    const entry = document.createElement('div');
    entry.className = `log-entry ${type}`;
    entry.innerText = `> ${text}`;
    logBox.appendChild(entry);
    logBox.scrollTop = logBox.scrollHeight;
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}
animate();
</script>
