<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HYNMOTA: Desert Tactics 3D VFX</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { margin: 0; padding: 0; overflow: hidden; background-color: #0b0806; font-family: 'Courier New', monospace; color: #d4a359; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        #hud {
            position: absolute; top: 12px; left: 12px; right: 12px;
            pointer-events: none; display: flex; justify-content: space-between; align-items: flex-start;
        }
        .panel {
            background: rgba(15, 11, 8, 0.92); border: 2px solid #8b6d43; border-radius: 6px;
            padding: 12px 16px; box-shadow: 0 0 20px rgba(0,0,0,0.95); pointer-events: auto; min-width: 220px;
        }
        .panel h2 { margin: 0 0 6px 0; font-size: 15px; color: #ff9d00; text-transform: uppercase; border-bottom: 1px solid #554228; padding-bottom: 4px; }
        .stat-row { font-size: 13px; margin: 6px 0; display: flex; justify-content: space-between; }
        .ap-badge { background: #2b7a3e; color: #fff; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        
        #target-panel {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            display: none; background: rgba(25, 10, 10, 0.95); border: 2px solid #ff3333;
            border-radius: 6px; padding: 12px 20px; text-align: center; pointer-events: auto;
        }
        #target-panel h3 { margin: 0 0 4px 0; color: #ff5964; font-size: 14px; }
        .hit-rate { font-size: 18px; font-weight: bold; color: #00ff66; margin: 6px 0; }
        
        #controls-panel {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 12px; pointer-events: auto;
        }
        .btn {
            background: #3a2a18; border: 2px solid #d4a359; color: #ffd89b; padding: 12px 24px;
            font-family: inherit; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; text-transform: uppercase;
        }
        .btn-shoot { background: #611818; border-color: #ff3333; color: #ffcccc; }
        .btn:active { transform: translateY(2px); }

        #log-box {
            position: absolute; bottom: 80px; left: 12px; width: 320px; max-height: 130px;
            overflow-y: auto; background: rgba(10, 8, 6, 0.9); border: 1px solid #554228;
            color: #a89474; font-size: 11px; padding: 8px; border-radius: 4px; pointer-events: none;
        }
        .log-entry { margin-bottom: 4px; }
        .log-entry.player { color: #5bc0be; }
        .log-entry.enemy { color: #ff5964; }
        .log-entry.hit { color: #00ff66; font-weight: bold; }
        .log-entry.miss { color: #ffcc00; }

        /* Контейнер для всплывающих цифр урона */
        #floating-text-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; overflow: hidden;
        }
        .dmg-text {
            position: absolute; font-family: 'Impact', sans-serif; font-size: 24px;
            font-weight: bold; text-shadow: 0 0 6px #000, 2px 2px 0 #000;
            transition: transform 0.8s ease-out, opacity 0.8s ease-out;
            will-change: transform, opacity;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="floating-text-container"></div>

    <div id="hud">
        <div class="panel">
            <h2 id="unit-name">Якуб</h2>
            <div class="stat-row">Класс: <span id="unit-class">Штурмовик</span></div>
            <div class="stat-row">HP: <span id="unit-hp">12 / 12</span></div>
            <div class="stat-row">AP: <span id="unit-ap" class="ap-badge">4</span></div>
        </div>
        <div class="panel" style="text-align: right;">
            <h2 style="color: #d4a359;">HYNMOTA 3D</h2>
            <div style="font-size: 12px; color: #ff9d00;" id="turn-display">ХОД ИГРОКА</div>
        </div>
    </div>

    <!-- ОКНО АТАКИ -->
    <div id="target-panel">
        <h3 id="target-name">Цель: Мутант</h3>
        <div style="font-size: 11px; color: #aaa;" id="target-cover">Укрытие: Нет</div>
        <div class="hit-rate" id="hit-chance">Шанс: 85%</div>
        <button class="btn btn-shoot" id="shoot-btn">ОГОНЬ (-2 AP)</button>
    </div>

    <div id="log-box">
        <div class="log-entry">Система визуальных эффектов подключена.</div>
        <div class="log-entry">Выберите врага и выстрелите!</div>
    </div>

    <div id="controls-panel">
        <button class="btn" id="end-turn-btn">Завершить ход</button>
    </div>

<script>
const GRID_SIZE = 10;
const TILE_SIZE = 2;
const scene = new THREE.Scene();

scene.background = new THREE.Color(0x120e0a);
scene.fog = new THREE.FogExp2(0x120e0a, 0.025);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(8, 14, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('canvas-container').appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(GRID_SIZE * TILE_SIZE / 2 - TILE_SIZE / 2, 0, GRID_SIZE * TILE_SIZE / 2 - TILE_SIZE / 2);

scene.add(new THREE.AmbientLight(0xd4a359, 0.5));
const sunLight = new THREE.DirectionalLight(0xffdfa9, 1.4);
sunLight.position.set(15, 25, 10);
sunLight.castShadow = true;
scene.add(sunLight);

// Сетка
const gridTiles = [];
const tileGeo = new THREE.BoxGeometry(TILE_SIZE - 0.1, 0.2, TILE_SIZE - 0.1);

for (let x = 0; x < GRID_SIZE; x++) {
    gridTiles[x] = [];
    for (let z = 0; z < GRID_SIZE; z++) {
        const tileMat = new THREE.MeshStandardMaterial({ color: 0x3a2d1f, roughness: 0.9 });
        const tile = new THREE.Mesh(tileGeo, tileMat);
        tile.position.set(x * TILE_SIZE, -0.1, z * TILE_SIZE);
        tile.receiveShadow = true;
        tile.userData = { gridX: x, gridZ: z, isTile: true, defaultColor: 0x3a2d1f };
        scene.add(tile);
        gridTiles[x][z] = tile;
    }
}

// Укрытия
function createCover(x, z, height = 1.3) {
    const geo = new THREE.BoxGeometry(TILE_SIZE * 0.8, height, TILE_SIZE * 0.8);
    const mat = new THREE.MeshStandardMaterial({ color: 0x282017, roughness: 0.9 });
    const cover = new THREE.Mesh(geo, mat);
    cover.position.set(x * TILE_SIZE, height / 2, z * TILE_SIZE);
    cover.castShadow = true;
    cover.receiveShadow = true;
    scene.add(cover);
    gridTiles[x][z].userData.blocked = true;
    gridTiles[x][z].userData.isCover = true;
}
createCover(3, 3);
createCover(3, 4);
createCover(6, 6);

// --- СИСТЕМА ЭФФЕКТОВ (VFX) ---

// 1. Трассер выстрела (Лазер)
function spawnTracer(startPos, endPos, isHit) {
    const points = [startPos.clone().add(new THREE.Vector3(0, 1.2, 0)), endPos.clone().add(new THREE.Vector3(0, 1.0, 0))];
    const geometry = new THREE.BufferGeometry().setFromPoints(points);
    const material = new THREE.LineBasicMaterial({
        color: isHit ? 0xffaa00 : 0xff3300,
        linewidth: 3
    });
    const line = new THREE.Line(geometry, material);
    scene.add(line);

    // Вспышка дула
    const flash = new THREE.PointLight(0xffaa00, 4, 3);
    flash.position.copy(points[0]);
    scene.add(flash);

    setTimeout(() => {
        scene.remove(line);
        scene.remove(flash);
    }, 120);
}

// 2. Искры в точке попадания
function spawnSparks(pos) {
    const particleCount = 12;
    const geometry = new THREE.BufferGeometry();
    const positions = [];

    for (let i = 0; i < particleCount; i++) {
        positions.push(pos.x, pos.y + 1.0, pos.z);
    }
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

    const material = new THREE.PointsMaterial({ color: 0xffdd44, size: 0.15, transparent: true, opacity: 1 });
    const pSystem = new THREE.Points(geometry, material);
    scene.add(pSystem);

    let frame = 0;
    const animateSparks = () => {
        frame++;
        const posArr = pSystem.geometry.attributes.position.array;
        for (let i = 0; i < particleCount * 3; i += 3) {
            posArr[i] += (Math.random() - 0.5) * 0.15;
            posArr[i+1] += Math.random() * 0.1;
            posArr[i+2] += (Math.random() - 0.5) * 0.15;
        }
        pSystem.geometry.attributes.position.needsUpdate = true;
        material.opacity -= 0.08;

        if (frame < 12) {
            requestAnimationFrame(animateSparks);
        } else {
            scene.remove(pSystem);
        }
    };
    animateSparks();
}

// 3. Всплывающий текст урона (Floating Text)
function showFloatingText(text, worldPos, color = '#ff3333') {
    const el = document.createElement('div');
    el.className = 'dmg-text';
    el.innerText = text;
    el.style.color = color;

    // Конвертируем 3D-координаты в 2D пиксели на экране
    const vector = worldPos.clone().add(new THREE.Vector3(0, 1.8, 0));
    vector.project(camera);

    const x = (vector.x * .5 + .5) * window.innerWidth;
    const y = (-(vector.y * .5) + .5) * window.innerHeight;

    el.style.left = `${x}px`;
    el.style.top = `${y}px`;
    document.getElementById('floating-text-container').appendChild(el);

    requestAnimationFrame(() => {
        el.style.transform = 'translateY(-40px) scale(1.2)';
        el.style.opacity = '0';
    });

    setTimeout(() => { el.remove(); }, 800);
}

// Юниты
const units = [];
let selectedUnit = null;
let currentTarget = null;

class Unit {
    constructor(name, className, x, z, hp, maxAp, isEnemy, color) {
        this.name = name;
        this.className = className;
        this.gridX = x;
        this.gridZ = z;
        this.hp = hp;
        this.maxHp = hp;
        this.ap = maxAp;
        this.maxAp = maxAp;
        this.isEnemy = isEnemy;

        this.mesh = new THREE.Group();
        this.mesh.position.set(x * TILE_SIZE, 0, z * TILE_SIZE);

        const bodyGeo = new THREE.CylinderGeometry(0.35, 0.35, 1.4, 12);
        const bodyMat = new THREE.MeshStandardMaterial({ color: color });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.7;
        body.castShadow = true;
        this.mesh.add(body);

        this.mesh.userData = { unit: this };
        scene.add(this.mesh);
    }

    moveTo(x, z) {
        const distance = Math.abs(this.gridX - x) + Math.abs(this.gridZ - z);
        if (this.ap >= distance && !gridTiles[x][z].userData.blocked) {
            this.gridX = x;
            this.gridZ = z;
            this.ap -= distance;
            
            this.mesh.position.set(x * TILE_SIZE, 0, z * TILE_SIZE);
            closeTargetPanel();
            updateUI();
            highlightMoveRange();
            addLog(`${this.name} шагнул на [${x}, ${z}] (-${distance} AP)`, this.isEnemy ? 'enemy' : 'player');
            return true;
        }
        return false;
    }

    takeDamage(amount) {
        this.hp -= amount;
        if (this.hp <= 0) {
            this.hp = 0;
            scene.remove(this.mesh);
            const index = units.indexOf(this);
            if (index > -1) units.splice(index, 1);
            addLog(`${this.name} Уничтожен!`, 'hit');
            closeTargetPanel();
        }
    }
}

// Спавн
const yakub = new Unit('Якуб', 'Штурмовик', 1, 1, 12, 4, false, 0x3d3226);
const enemy = new Unit('Кочевник-Мутант', 'Берсерк', 5, 4, 10, 4, true, 0x8b2626);
units.push(yakub, enemy);
selectedUnit = yakub;

// Загрузка GLB если есть
const gltfLoader = new THREE.GLTFLoader();
gltfLoader.load('./models/yakub.glb', (gltf) => {
    yakub.mesh.clear();
    const model = gltf.scene;
    model.traverse(n => { if (n.isMesh) n.castShadow = true; });
    yakub.mesh.add(model);
    addLog('3D-модель Якуба подключена!', 'player');
}, null, () => {});

function calculateHitChance(attacker, target) {
    let baseChance = 85;
    let coverType = 'Нет (85%)';

    const dx = Math.sign(attacker.gridX - target.gridX);
    const dz = Math.sign(attacker.gridZ - target.gridZ);

    const checkX = target.gridX + dx;
    const checkZ = target.gridZ + dz;

    if (checkX >= 0 && checkX < GRID_SIZE && gridTiles[checkX][target.gridZ].userData.isCover) {
        baseChance = 45;
        coverType = 'Укрытие (45%)';
    } else if (checkZ >= 0 && checkZ < GRID_SIZE && gridTiles[target.gridX][checkZ].userData.isCover) {
        baseChance = 45;
        coverType = 'Укрытие (45%)';
    }

    return { chance: baseChance, cover: coverType };
}

// Управление
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function onPointerDown(event) {
    const x = event.clientX || (event.touches && event.touches[0].clientX);
    const y = event.clientY || (event.touches && event.touches[0].clientY);
    if (!x || !y) return;

    mouse.x = (x / window.innerWidth) * 2 - 1;
    mouse.y = -(y / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(scene.children, true);

    for (let hit of intersects) {
        let parentGroup = hit.object.parent;
        while (parentGroup && !parentGroup.userData.unit) parentGroup = parentGroup.parent;

        if (parentGroup && parentGroup.userData.unit) {
            const unit = parentGroup.userData.unit;
            if (unit.isEnemy) {
                currentTarget = unit;
                openTargetPanel(unit);
                return;
            }
        }

        if (hit.object.userData && hit.object.userData.isTile && selectedUnit) {
            selectedUnit.moveTo(hit.object.userData.gridX, hit.object.userData.gridZ);
            return;
        }
    }
}

window.addEventListener('pointerdown', onPointerDown);

function openTargetPanel(target) {
    const calculation = calculateHitChance(selectedUnit, target);
    document.getElementById('target-panel').style.display = 'block';
    document.getElementById('target-name').innerText = `Цель: ${target.name} [HP: ${target.hp}/${target.maxHp}]`;
    document.getElementById('target-cover').innerText = `Защита: ${calculation.cover}`;
    document.getElementById('hit-chance').innerText = `Шанс: ${calculation.chance}%`;
}

function closeTargetPanel() {
    document.getElementById('target-panel').style.display = 'none';
    currentTarget = null;
}

// ВЫСТРЕЛ С ЭФФЕКТАМИ
document.getElementById('shoot-btn').addEventListener('click', () => {
    if (!selectedUnit || !currentTarget) return;

    if (selectedUnit.ap < 2) {
        addLog('Недостаточно AP для выстрела! (Нужно 2 AP)', 'enemy');
        return;
    }

    selectedUnit.ap -= 2;
    const calc = calculateHitChance(selectedUnit, currentTarget);
    const roll = Math.floor(Math.random() * 100);
    const isHit = roll < calc.chance;

    // 1. Поворот к цели
    const dx = currentTarget.gridX - selectedUnit.gridX;
    const dz = currentTarget.gridZ - selectedUnit.gridZ;
    selectedUnit.mesh.rotation.y = Math.atan2(dx, dz);

    // 2. Спавн трассера выстрела
    spawnTracer(selectedUnit.mesh.position, currentTarget.mesh.position, isHit);

    if (isHit) {
        const damage = Math.floor(Math.random() * 3) + 4; // 4-6 урона
        spawnSparks(currentTarget.mesh.position);
        showFloatingText(`-${damage}`, currentTarget.mesh.position, '#ff3333');
        addLog(`ПОПАДАНИЕ! ${selectedUnit.name} нанес ${damage} урона по ${currentTarget.name}!`, 'hit');
        currentTarget.takeDamage(damage);
    } else {
        showFloatingText('ПРОМАХ!', currentTarget.mesh.position, '#ffcc00');
        addLog(`${selectedUnit.name} ПРОМАХНУЛСЯ!`, 'miss');
    }

    updateUI();
    highlightMoveRange();

    if (currentTarget && currentTarget.hp > 0) {
        openTargetPanel(currentTarget);
    }
});

function highlightMoveRange() {
    for (let x = 0; x < GRID_SIZE; x++) {
        for (let z = 0; z < GRID_SIZE; z++) {
            gridTiles[x][z].material.color.setHex(gridTiles[x][z].userData.defaultColor);
        }
    }

    if (!selectedUnit || selectedUnit.ap <= 0) return;

    for (let x = 0; x < GRID_SIZE; x++) {
        for (let z = 0; z < GRID_SIZE; z++) {
            const dist = Math.abs(selectedUnit.gridX - x) + Math.abs(selectedUnit.gridZ - z);
            if (dist <= selectedUnit.ap && dist > 0 && !gridTiles[x][z].userData.blocked) {
                gridTiles[x][z].material.color.setHex(0x2e5a3c);
            }
        }
    }
}
highlightMoveRange();

function updateUI() {
    if (selectedUnit) {
        document.getElementById('unit-name').innerText = selectedUnit.name;
        document.getElementById('unit-hp').innerText = `${selectedUnit.hp} / ${selectedUnit.maxHp}`;
        document.getElementById('unit-ap').innerText = selectedUnit.ap;
    }
}

function addLog(text, type = '') {
    const logBox = document.getElementById('log-box');
    const entry = document.createElement('div');
    entry.className = `log-entry ${type}`;
    entry.innerText = `> ${text}`;
    logBox.appendChild(entry);
    logBox.scrollTop = logBox.scrollHeight;
}

document.getElementById('end-turn-btn').addEventListener('click', () => {
    selectedUnit.ap = selectedUnit.maxAp;
    closeTargetPanel();
    addLog('Ход обновлен. AP восстановлены.', 'player');
    updateUI();
    highlightMoveRange();
});

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
